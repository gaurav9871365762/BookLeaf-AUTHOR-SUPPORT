services:
  mongo:
    image: mongo:7.0
    container_name: bookleaf-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bookleaf-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bookleaf-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/bookleaf_support
      JWT_SECRET: ${JWT_SECRET:-bookleaf_super_secret_jwt_key_author_support_portal_2026_secure}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_NAME: ${ADMIN_NAME:-BookLeaf Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bookleaf.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      DEMO_AUTHOR_PASSWORD: ${DEMO_AUTHOR_PASSWORD:-AuthorPassword123!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bookleaf-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bookleaf-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server
    networks:
      - bookleaf-network

volumes:
  mongo_data:
    driver: local

networks:
  bookleaf-network:
    driver: bridge
